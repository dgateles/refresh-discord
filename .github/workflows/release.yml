name: Build native release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build native executable
        run: msbuild DiscordRefreshProxy.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}
      - name: Self-check
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/x64/DiscordRefreshProxy-x64.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-check falhou (codigo $($p.ExitCode))" }
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = "artifacts/${{ matrix.platform }}/DiscordRefreshProxy-${{ matrix.platform }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($exe))" | Set-Content "$exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordRefreshProxy-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/DiscordRefreshProxy-${{ matrix.platform }}.exe*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --generate-notes --title "Discord Refresh Proxy ${{ github.ref_name }}"
